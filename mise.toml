[tools]
node = "24.21.0"
go = "1.27.1"

[env]
NEXT_TELEMETRY_DISABLED = "1"

[tasks.install]
description = "Install locked JavaScript dependencies"
run = "npm ci"

[tasks.dev]
run = "npm run dev"

[tasks.build]
run = "npm run build"

[tasks.start]
run = "npm start"

[tasks.lint]
run = "npm run lint"

[tasks.typecheck]
run = "npm run typecheck"

[tasks.test]
run = "npm test -- --runInBand"

[tasks.e2e]
run = "npm run test:e2e"

[tasks.check]
depends = ["data:check"]
run = "npm run check"

[tasks."data:check"]
dir = "tools/poke-json"
run = ["go vet ./...", "go test -race ./...", "node --test pipeline.test.mjs", "node pipeline.mjs verify"]

[tasks."data:run"]
run = "node tools/poke-json/pipeline.mjs generate"

[tasks."data:generate"]
run = "node tools/poke-json/pipeline.mjs generate"

[tasks."data:review"]
run = "node tools/poke-json/pipeline.mjs review"

[tasks."data:apply"]
run = "node tools/poke-json/pipeline.mjs apply"

[tasks."data:verify"]
run = "node tools/poke-json/pipeline.mjs verify"
