[tools]
node = "24.21.0"
go = "1.27.1"

[env]
NEXT_TELEMETRY_DISABLED = "1"

[tasks.install]
description = "Install locked JavaScript dependencies"
run = "npm ci"

[tasks.dev]
run = "npm run dev"

[tasks.build]
run = "npm run build"

[tasks.start]
run = "npm start"

[tasks.lint]
run = "npm run lint"

[tasks.typecheck]
run = "npm run typecheck"

[tasks.test]
run = "npm test -- --runInBand"

[tasks.e2e]
run = "npm run test:e2e"

[tasks.check]
depends = ["data:check", "knowledge:check"]
run = "npm run check"

[tasks."data:check"]
dir = "tools"
run = ["go vet ./...", "go test -race ./...", "node --test pipeline.test.mjs review-state.test.mjs console.test.mjs", "node pipeline.mjs verify"]

[tasks."data:generate"]
run = "node tools/pipeline.mjs generate"

[tasks."data:review"]
run = "node tools/pipeline.mjs review"

[tasks."data:apply"]
run = "node tools/pipeline.mjs apply"

[tasks."data:verify"]
run = "node tools/pipeline.mjs verify"

[tasks."data:console"]
run = "node tools/console.mjs"

[tasks."data:console:test"]
run = "node --test tools/console.browser.test.mjs tools/knowledge.browser.test.mjs"

[tasks."knowledge:check"]
run = ["node tools/knowledge-model.mjs check", "node --test tools/knowledge.test.mjs"]

[tasks."knowledge:sync"]
run = "node tools/knowledge-model.mjs sync"

[tasks."seo:check"]
description = "Check production HTML, indexing metadata and redirects after building"
run = "npm run test:seo"
